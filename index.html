<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>钉钉开机</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #8b98a5;
      --line: #2a3542;
      --blue: #2f6fed;
      --blue-glow: rgba(47, 111, 237, 0.45);
      --gray: #6b7280;
      --ok: #3bb273;
      --bad: #e05555;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(900px 500px at 50% 0%, #1a2740 0%, var(--bg) 55%);
      color: var(--text);
    }
    .page { min-height: 100%; display: none; flex-direction: column; }
    .page.active { display: flex; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 8px;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    .linkbtn {
      border: 0; background: transparent; color: var(--text);
      font-size: 15px; font-weight: 600; padding: 8px 4px; cursor: pointer;
    }
    .stage {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 12px 20px 28px;
    }
    .mode-tag {
      margin-bottom: 28px; font-size: 14px; color: var(--muted); letter-spacing: .08em;
    }
    .orb {
      width: min(72vw, 280px); height: min(72vw, 280px); border-radius: 50%;
      border: 0; cursor: pointer; color: #fff; font-size: 28px; font-weight: 750;
      letter-spacing: .06em;
      transition: transform .12s ease, background .25s ease, box-shadow .25s ease;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .orb:active { transform: scale(.97); }
    .orb.on {
      background: radial-gradient(circle at 35% 30%, #5b8cff, var(--blue) 55%, #1f4fb8);
      box-shadow: 0 0 0 14px rgba(47,111,237,.12), 0 18px 55px var(--blue-glow);
    }
    .orb.off {
      background: radial-gradient(circle at 35% 30%, #9aa3ad, var(--gray) 60%, #4b5563);
      box-shadow: 0 0 0 14px rgba(107,114,128,.1), 0 18px 40px rgba(0,0,0,.35);
    }
    .orb.busy { opacity: .75; pointer-events: none; }
    .status {
      margin-top: 36px; width: min(88vw, 360px); text-align: center;
      min-height: 64px;
    }
    .status .title {
      font-size: 18px; font-weight: 750; margin-bottom: 6px;
    }
    .status .title.ok { color: var(--ok); }
    .status .title.bad { color: var(--bad); }
    .status .title.wait { color: var(--muted); }
    .status .reason { font-size: 14px; color: var(--muted); line-height: 1.5; }

    .cfg-head {
      display: flex; align-items: center; gap: 8px;
      padding: 18px 16px 10px;
    }
    .cfg-head h1 { font-size: 20px; margin: 0; flex: 1; }
    .cfg-body { padding: 8px 16px 32px; overflow: auto; }
    .block {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 16px; margin-bottom: 12px;
    }
    .block h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    .row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    .field.full { grid-column: 1 / -1; }
    input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; font-size: 16px; color: var(--text); background: #12181f; outline: none;
    }
    input:focus, select:focus { border-color: var(--blue); }
    .seg {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .seg button {
      border: 1px solid var(--line); background: #12181f; color: var(--muted);
      border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .seg button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .actions { display: grid; gap: 10px; margin-top: 8px; }
    .btn {
      border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 750;
      cursor: pointer; color: #fff;
    }
    .btn.primary { background: var(--blue); }
    .btn.ghost { background: #243040; color: var(--text); }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: rgba(20,26,34,.92); color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
  </style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem("dingtalk_remote_setup_v1")||"{}");if(!s.gistId){s.gistId="dc02d44e3153f1119d11a06efbeafc7a";s.fileName="dingtalk-config.json";localStorage.setItem("dingtalk_remote_setup_v1",JSON.stringify(s));}}catch(e){}})();</script>
</head>
<body>
  <div class="page active" id="homePage">
    <div class="topbar">
      <div class="brand">钉钉开机</div>
      <button class="linkbtn" id="goConfigBtn" type="button">配置</button>
    </div>
    <div class="stage">
      <div class="mode-tag" id="modeTag">自动</div>
      <button class="orb off" id="orbBtn" type="button">关</button>
      <div class="status" id="statusBox">
        <div class="title wait" id="statusTitle">待机</div>
        <div class="reason" id="statusReason"></div>
      </div>
    </div>
  </div>

  <div class="page" id="configPage">
    <div class="cfg-head">
      <button class="linkbtn" id="backHomeBtn" type="button">返回</button>
      <h1>配置</h1>
    </div>
    <div class="cfg-body">
      <div class="block">
        <h2>模式</h2>
        <div class="seg">
          <button type="button" id="modeAutoBtn">自动</button>
          <button type="button" id="modeManualBtn">手动</button>
        </div>
      </div>

      <div class="block">
        <h2>每日开关</h2>
        <div class="seg">
          <button type="button" id="enableOnBtn">开</button>
          <button type="button" id="enableOffBtn">关</button>
        </div>
      </div>

      <div class="block">
        <h2>脚本开始运行时间</h2>
        <div class="row">
          <label class="field">时<input id="schH" type="number" min="0" max="23" /></label>
          <label class="field">分<input id="schM" type="number" min="0" max="59" /></label>
          <label class="field">秒<input id="schS" type="number" min="0" max="59" /></label>
        </div>
      </div>

      <div class="block">
        <h2>随机开始时间</h2>
        <div class="row">
          <label class="field">时<input id="stH" type="number" min="0" max="23" /></label>
          <label class="field">分<input id="stM" type="number" min="0" max="59" /></label>
          <label class="field">秒<input id="stS" type="number" min="0" max="59" /></label>
        </div>
        <h2 style="margin-top:14px">随机结束时间</h2>
        <div class="row">
          <label class="field">时<input id="enH" type="number" min="0" max="23" /></label>
          <label class="field">分<input id="enM" type="number" min="0" max="59" /></label>
          <label class="field">秒<input id="enS" type="number" min="0" max="59" /></label>
        </div>
      </div>

      <div class="block">
        <h2>连接</h2>
        <div class="row">
          <label class="field full">Gist ID<input id="gistId" autocomplete="off" /></label>
          <label class="field full">文件名<input id="fileName" value="dingtalk-config.json" autocomplete="off" /></label>
          <label class="field full">Token<input id="token" type="password" autocomplete="off" /></label>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="saveCfgBtn" type="button">保存</button>
        <button class="btn ghost" id="reloadCfgBtn" type="button">重新读取</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  /**
   * 手动 / 自动 = 两套互不影响的进程：
   * - statusManual + command 只服务手动
   * - statusAuto + planned* 只服务自动
   * - 切换 mode 只换「当前看哪套」，不清另一套
   * - 主页大球：自动=切开关；手动=下发 command
   */
  (function () {
    const STORE_KEY = "dingtalk_remote_setup_v1";
    const POLL_MS = 3000;
    const FAST_POLL_MS = 800;

    function emptyStatus(source) {
      return { phase: "idle", ok: null, reason: "", at: "", source: source || "" };
    }

    const DEFAULT = {
      enabled: true,
      mode: "auto",
      scheduleHour: 8,
      scheduleMinute: 27,
      scheduleSecond: 0,
      startHour: 8,
      startMinute: 28,
      startSecond: 0,
      endHour: 8,
      endMinute: 30,
      endSecond: 50,
      command: null,
      manualTriggerId: "",
      statusManual: emptyStatus("manual"),
      statusAuto: emptyStatus("auto"),
      plannedOpenAt: "",
      plannedOpenDate: "",
      plannedOpenTs: 0,
      status: emptyStatus(""),
      lastResult: null
    };

    const state = {
      setup: loadSetup(),
      config: Object.assign({}, DEFAULT),
      busy: false,
      page: "home",
      fastWatch: null
    };

    /* ---------- utils ---------- */
    function loadSetup() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; }
      catch (e) { return {}; }
    }
    function persistSetup(s) {
      state.setup = s;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    }
    function clamp(n, min, max) {
      n = parseInt(n, 10);
      if (isNaN(n)) return min;
      return Math.max(min, Math.min(max, n));
    }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }
    function apiHeaders() {
      return {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + state.setup.token,
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
      };
    }
    function hasConnection() {
      return !!(state.setup.gistId && state.setup.token);
    }
    function toSeconds(h, m, s) {
      return h * 3600 + m * 60 + s;
    }

    function normStatus(st, source) {
      if (!st || typeof st !== "object") st = emptyStatus(source);
      let phase = st.phase || "idle";
      if (!st.phase) {
        if (st.ok === true) phase = "success";
        else if (st.ok === false) phase = "failure";
      }
      return {
        phase: phase,
        ok: st.ok === true ? true : (st.ok === false ? false : null),
        reason: String(st.reason || ""),
        at: st.at || "",
        source: st.source || source || ""
      };
    }

    function mirrorStatus(c) {
      const st = c.mode === "manual" ? c.statusManual : c.statusAuto;
      c.status = normStatus(st, c.mode);
      c.lastResult = c.status.phase === "idle" ? null : {
        ok: !!c.status.ok,
        reason: c.status.reason,
        at: c.status.at,
        source: c.status.source
      };
    }

    /* ---------- 数据规范化（双进程模型） ---------- */
    function normalize(raw) {
      const c = Object.assign({}, DEFAULT, raw || {});
      c.enabled = !!c.enabled;
      c.mode = c.mode === "manual" ? "manual" : "auto";
      ["scheduleHour", "startHour", "endHour"].forEach((k) => { c[k] = clamp(c[k], 0, 23); });
      ["scheduleMinute", "scheduleSecond", "startMinute", "startSecond", "endMinute", "endSecond"]
        .forEach((k) => { c[k] = clamp(c[k], 0, 59); });
      c.plannedOpenAt = c.plannedOpenAt ? String(c.plannedOpenAt) : "";
      c.plannedOpenDate = c.plannedOpenDate ? String(c.plannedOpenDate) : "";
      c.plannedOpenTs = parseInt(c.plannedOpenTs, 10) || 0;

      if ((!c.command || !c.command.id) && c.manualTriggerId) {
        c.command = { id: String(c.manualTriggerId), type: "run_now", at: new Date().toISOString() };
      }
      if (c.command && c.command.id) {
        c.command = {
          id: String(c.command.id),
          type: c.command.type || "run_now",
          at: c.command.at || ""
        };
        c.manualTriggerId = c.command.id;
      } else {
        c.command = null;
        c.manualTriggerId = "";
      }

      let statusManual = c.statusManual;
      let statusAuto = c.statusAuto;
      if ((!statusManual || !statusManual.phase) && (!statusAuto || !statusAuto.phase)) {
        const old = c.status || c.lastResult;
        if (old) {
          const n = normStatus({
            phase: old.phase || (old.ok ? "success" : (String(old.reason || "").indexOf("等待") >= 0 ? "pending" : "failure")),
            ok: old.ok,
            reason: old.reason,
            at: old.at,
            source: old.source
          }, "");
          if (n.source === "manual") statusManual = n;
          else if (n.source === "auto") statusAuto = n;
        }
      }
      c.statusManual = normStatus(statusManual, "manual");
      c.statusAuto = normStatus(statusAuto, "auto");
      mirrorStatus(c);
      return c;
    }

    /* ---------- 视图 ---------- */
    function showPage(name) {
      state.page = name;
      document.getElementById("homePage").classList.toggle("active", name === "home");
      document.getElementById("configPage").classList.toggle("active", name === "config");
    }

    function renderHome() {
      const cfg = state.config;
      const orb = document.getElementById("orbBtn");
      const manual = cfg.mode === "manual";
      document.getElementById("modeTag").textContent = manual ? "手动" : "自动";

      // 颜色永远跟 enabled
      orb.className = "orb " + (cfg.enabled ? "on" : "off") + (state.busy ? " busy" : "");
      if (manual) {
        orb.textContent = cfg.enabled ? "启动" : "关";
      } else {
        orb.textContent = cfg.enabled ? "开" : "关";
      }

      const title = document.getElementById("statusTitle");
      const reason = document.getElementById("statusReason");
      // 只显示当前模式对应进程的状态
      const st = (manual ? cfg.statusManual : cfg.statusAuto) || {};
      const planLine =
        !manual && cfg.enabled && cfg.plannedOpenAt
          ? ("今日 " + (cfg.plannedOpenAt || ""))
          : "";

      if (manual) {
        if (st.phase === "success") {
          title.className = "title ok";
          title.textContent = "成功";
          reason.textContent = st.reason || "";
        } else if (st.phase === "failure") {
          title.className = "title bad";
          title.textContent = "失败";
          reason.textContent = st.reason || "";
        } else if (st.phase === "pending") {
          title.className = "title wait";
          title.textContent = "执行中";
          reason.textContent = st.reason || "已发送，等待手机执行";
        } else {
          title.className = "title wait";
          title.textContent = "待机";
          reason.textContent = "";
        }
      } else if (st.phase === "success") {
        title.className = "title ok";
        title.textContent = "成功";
        reason.textContent = st.reason || "";
      } else if (st.phase === "pending" || planLine) {
        title.className = "title wait";
        title.textContent = planLine || "等待中";
        reason.textContent = st.reason || "到达后自动打开";
      } else if (st.phase === "failure") {
        title.className = "title bad";
        title.textContent = "失败";
        reason.textContent = st.reason || "";
      } else {
        title.className = "title wait";
        title.textContent = "待机";
        reason.textContent = "";
      }
    }

    function fillConfigForm() {
      const cfg = state.config;
      const setup = state.setup;
      document.getElementById("modeAutoBtn").classList.toggle("active", cfg.mode === "auto");
      document.getElementById("modeManualBtn").classList.toggle("active", cfg.mode === "manual");
      document.getElementById("enableOnBtn").classList.toggle("active", !!cfg.enabled);
      document.getElementById("enableOffBtn").classList.toggle("active", !cfg.enabled);
      document.getElementById("schH").value = cfg.scheduleHour;
      document.getElementById("schM").value = cfg.scheduleMinute;
      document.getElementById("schS").value = cfg.scheduleSecond;
      document.getElementById("stH").value = cfg.startHour;
      document.getElementById("stM").value = cfg.startMinute;
      document.getElementById("stS").value = cfg.startSecond;
      document.getElementById("enH").value = cfg.endHour;
      document.getElementById("enM").value = cfg.endMinute;
      document.getElementById("enS").value = cfg.endSecond;
      document.getElementById("gistId").value = setup.gistId || "";
      document.getElementById("fileName").value = setup.fileName || "dingtalk-config.json";
      document.getElementById("token").value = setup.token || "";
    }

    function readConfigForm() {
      const cur = state.config;
      // 保存配置时原样保留另一进程的状态/计划/指令，互不覆盖
      const next = normalize({
        enabled: document.getElementById("enableOnBtn").classList.contains("active"),
        mode: document.getElementById("modeManualBtn").classList.contains("active") ? "manual" : "auto",
        scheduleHour: document.getElementById("schH").value,
        scheduleMinute: document.getElementById("schM").value,
        scheduleSecond: document.getElementById("schS").value,
        startHour: document.getElementById("stH").value,
        startMinute: document.getElementById("stM").value,
        startSecond: document.getElementById("stS").value,
        endHour: document.getElementById("enH").value,
        endMinute: document.getElementById("enM").value,
        endSecond: document.getElementById("enS").value,
        command: cur.command,
        manualTriggerId: cur.manualTriggerId,
        statusManual: cur.statusManual,
        statusAuto: cur.statusAuto,
        plannedOpenAt: cur.plannedOpenAt,
        plannedOpenDate: cur.plannedOpenDate,
        plannedOpenTs: cur.plannedOpenTs
      });
      if (toSeconds(next.startHour, next.startMinute, next.startSecond) >=
          toSeconds(next.endHour, next.endMinute, next.endSecond)) {
        throw new Error("随机结束时间必须晚于开始时间");
      }
      return next;
    }

    function setSeg(onId, offId, on) {
      document.getElementById(onId).classList.toggle("active", on);
      document.getElementById(offId).classList.toggle("active", !on);
    }

    /* ---------- 云端 IO ---------- */
    async function pull() {
      if (!hasConnection()) throw new Error("请先在配置页填写连接信息");
      const res = await fetch(
        "https://api.github.com/gists/" + encodeURIComponent(state.setup.gistId),
        { headers: apiHeaders() }
      );
      if (!res.ok) throw new Error("读取失败 " + res.status);
      const data = await res.json();
      const file = data.files && data.files[state.setup.fileName || "dingtalk-config.json"];
      if (!file) throw new Error("找不到配置文件");
      state.config = normalize(JSON.parse(file.content || "{}"));
      renderHome();
      if (state.page === "config") fillConfigForm();
      return state.config;
    }

    async function push(next) {
      if (!hasConnection()) throw new Error("请先在配置页填写连接信息");
      next = normalize(next);
      const body = {
        files: {
          [state.setup.fileName || "dingtalk-config.json"]: {
            content: JSON.stringify(next, null, 2)
          }
        }
      };
      const res = await fetch(
        "https://api.github.com/gists/" + encodeURIComponent(state.setup.gistId),
        { method: "PATCH", headers: apiHeaders(), body: JSON.stringify(body) }
      );
      if (!res.ok) throw new Error("保存失败 " + res.status);
      state.config = next;
      renderHome();
      return next;
    }

    function withBusy(fn) {
      return async function () {
        if (state.busy) return;
        state.busy = true;
        renderHome();
        try {
          await fn();
        } catch (e) {
          toast(String(e.message || e));
        } finally {
          state.busy = false;
          renderHome();
        }
      };
    }

    function stopFastWatch() {
      if (state.fastWatch) {
        clearInterval(state.fastWatch);
        state.fastWatch = null;
      }
    }

    // 执行中：0.8 秒刷一次，一有成功/失败立刻显示
    function startFastWatch(timeoutMs) {
      stopFastWatch();
      const deadline = Date.now() + (timeoutMs || 45000);
      state.fastWatch = setInterval(async function () {
        if (!hasConnection() || state.page !== "home") return;
        if (Date.now() > deadline) {
          stopFastWatch();
          return;
        }
        try {
          await pull();
          const st = state.config.statusManual || {};
          if (st.phase === "success" || st.phase === "failure") stopFastWatch();
        } catch (e) {}
      }, FAST_POLL_MS);
    }

    /* ---------- 命令：主页大球 ---------- */
    async function onOrbClick() {
      if (!hasConnection()) {
        showPage("config");
        fillConfigForm();
        toast("先完成配置");
        return;
      }
      if (state.config.mode === "auto") {
        await pull();
      }
      const cfg = state.config;

      if (cfg.mode === "auto") {
        // 只改开关；不动手动 command / statusManual
        await push(Object.assign({}, cfg, { enabled: !cfg.enabled }));
        toast(cfg.enabled ? "已关闭" : "已开启");
        return;
      }

      if (!cfg.enabled) {
        await push(Object.assign({}, cfg, { enabled: true }));
        toast("已开启");
        return;
      }

      const id = uid();
      const now = new Date().toISOString();
      // 只写手动字段；保留自动的 planned* / statusAuto
      await push(Object.assign({}, cfg, {
        enabled: true,
        command: { id: id, type: "run_now", at: now },
        manualTriggerId: id,
        statusManual: {
          phase: "pending",
          ok: false,
          reason: "已发送，等待手机执行",
          at: now,
          source: "manual"
        }
      }));
      toast("已发送");
      startFastWatch(45000);
    }

    /* ---------- 事件绑定 ---------- */
    document.getElementById("goConfigBtn").onclick = function () {
      fillConfigForm();
      showPage("config");
    };
    document.getElementById("backHomeBtn").onclick = function () {
      showPage("home");
      renderHome();
    };

    document.getElementById("modeAutoBtn").onclick = function () {
      setSeg("modeAutoBtn", "modeManualBtn", true);
    };
    document.getElementById("modeManualBtn").onclick = function () {
      setSeg("modeManualBtn", "modeAutoBtn", true);
    };
    document.getElementById("enableOnBtn").onclick = function () {
      setSeg("enableOnBtn", "enableOffBtn", true);
    };
    document.getElementById("enableOffBtn").onclick = function () {
      setSeg("enableOffBtn", "enableOnBtn", true);
    };

    document.getElementById("saveCfgBtn").onclick = withBusy(async function () {
      persistSetup({
        gistId: document.getElementById("gistId").value.trim(),
        fileName: document.getElementById("fileName").value.trim() || "dingtalk-config.json",
        token: document.getElementById("token").value.trim()
      });
      const next = readConfigForm();
      await push(next);
      await pull();
      const c = state.config;
      toast(
        "已保存 " +
          c.scheduleHour + ":" + pad2(c.scheduleMinute) + ":" + pad2(c.scheduleSecond) +
          " / 随机" +
          c.startHour + ":" + pad2(c.startMinute) + ":" + pad2(c.startSecond) +
          "~" +
          c.endHour + ":" + pad2(c.endMinute) + ":" + pad2(c.endSecond)
      );
      showPage("home");
    });

    function pad2(n) {
      n = parseInt(n, 10) || 0;
      return n < 10 ? "0" + n : "" + n;
    }

    document.getElementById("reloadCfgBtn").onclick = withBusy(async function () {
      persistSetup({
        gistId: document.getElementById("gistId").value.trim(),
        fileName: document.getElementById("fileName").value.trim() || "dingtalk-config.json",
        token: document.getElementById("token").value.trim()
      });
      await pull();
      fillConfigForm();
      toast("已读取");
    });

    document.getElementById("orbBtn").onclick = withBusy(onOrbClick);

    async function boot() {
      fillConfigForm();
      renderHome();
      if (!hasConnection()) {
        showPage("config");
        return;
      }
      try {
        await pull();
      } catch (e) {
        toast(String(e.message || e));
      }
      setInterval(async function () {
        if (!hasConnection() || state.busy || state.page !== "home") return;
        // 快刷进行中时，普通轮询让路，避免抢请求
        if (state.fastWatch) return;
        try { await pull(); } catch (e) {}
      }, POLL_MS);
    }

    boot();
  })();
  </script>
</body>
</html>
