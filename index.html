<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>钉钉开机</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #8b98a5;
      --line: #2a3542;
      --blue: #2f6fed;
      --blue-glow: rgba(47, 111, 237, 0.45);
      --gray: #6b7280;
      --ok: #3bb273;
      --bad: #e05555;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(900px 500px at 50% 0%, #1a2740 0%, var(--bg) 55%);
      color: var(--text);
    }
    .page { min-height: 100%; display: none; flex-direction: column; }
    .page.active { display: flex; }

    /* 主页 */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 8px;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    .linkbtn {
      border: 0; background: transparent; color: var(--text);
      font-size: 15px; font-weight: 600; padding: 8px 4px; cursor: pointer;
    }
    .stage {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 12px 20px 28px;
    }
    .mode-tag {
      margin-bottom: 28px; font-size: 14px; color: var(--muted); letter-spacing: .08em;
    }
    .orb {
      width: min(72vw, 280px); height: min(72vw, 280px); border-radius: 50%;
      border: 0; cursor: pointer; color: #fff; font-size: 28px; font-weight: 750;
      letter-spacing: .06em;
      transition: transform .12s ease, background .25s ease, box-shadow .25s ease;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .orb:active { transform: scale(.97); }
    .orb.on {
      background: radial-gradient(circle at 35% 30%, #5b8cff, var(--blue) 55%, #1f4fb8);
      box-shadow: 0 0 0 14px rgba(47,111,237,.12), 0 18px 55px var(--blue-glow);
    }
    .orb.off {
      background: radial-gradient(circle at 35% 30%, #9aa3ad, var(--gray) 60%, #4b5563);
      box-shadow: 0 0 0 14px rgba(107,114,128,.1), 0 18px 40px rgba(0,0,0,.35);
    }
    .orb.busy { opacity: .75; pointer-events: none; }
    .status {
      margin-top: 36px; width: min(88vw, 360px); text-align: center;
      min-height: 64px;
    }
    .status .title {
      font-size: 18px; font-weight: 750; margin-bottom: 6px;
    }
    .status .title.ok { color: var(--ok); }
    .status .title.bad { color: var(--bad); }
    .status .title.wait { color: var(--muted); }
    .status .reason { font-size: 14px; color: var(--muted); line-height: 1.5; }

    /* 配置页 */
    .cfg-head {
      display: flex; align-items: center; gap: 8px;
      padding: 18px 16px 10px;
    }
    .cfg-head h1 { font-size: 20px; margin: 0; flex: 1; }
    .cfg-body { padding: 8px 16px 32px; overflow: auto; }
    .block {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 16px; margin-bottom: 12px;
    }
    .block h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    .row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    .field.full { grid-column: 1 / -1; }
    input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; font-size: 16px; color: var(--text); background: #12181f; outline: none;
    }
    input:focus, select:focus { border-color: var(--blue); }
    .seg {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .seg button {
      border: 1px solid var(--line); background: #12181f; color: var(--muted);
      border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .seg button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .actions { display: grid; gap: 10px; margin-top: 8px; }
    .btn {
      border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 750;
      cursor: pointer; color: #fff;
    }
    .btn.primary { background: var(--blue); }
    .btn.ghost { background: #243040; color: var(--text); }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: rgba(20,26,34,.92); color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
  </style>
<script>
(function () {
  var existing = {};
  try { existing = JSON.parse(localStorage.getItem("dingtalk_remote_setup_v1") || "{}") || {}; } catch (e) {}
  if (!existing.gistId) {
    existing.gistId = "dc02d44e3153f1119d11a06efbeafc7a";
    existing.fileName = "dingtalk-config.json";
    localStorage.setItem("dingtalk_remote_setup_v1", JSON.stringify(existing));
  }
})();
</script>
</head>
<body>
  <div class="page active" id="homePage">
    <div class="topbar">
      <div class="brand">钉钉开机</div>
      <button class="linkbtn" id="goConfigBtn" type="button">配置</button>
    </div>
    <div class="stage">
      <div class="mode-tag" id="modeTag">自动</div>
      <button class="orb off" id="orbBtn" type="button">关</button>
      <div class="status" id="statusBox">
        <div class="title wait" id="statusTitle">等待</div>
        <div class="reason" id="statusReason"></div>
      </div>
    </div>
  </div>

  <div class="page" id="configPage">
    <div class="cfg-head">
      <button class="linkbtn" id="backHomeBtn" type="button">返回</button>
      <h1>配置</h1>
    </div>
    <div class="cfg-body">
      <div class="block">
        <h2>模式</h2>
        <div class="seg">
          <button type="button" id="modeAutoBtn">自动</button>
          <button type="button" id="modeManualBtn">手动</button>
        </div>
      </div>

      <div class="block">
        <h2>每日开关</h2>
        <div class="seg">
          <button type="button" id="enableOnBtn">开</button>
          <button type="button" id="enableOffBtn">关</button>
        </div>
      </div>

      <div class="block">
        <h2>脚本开始运行时间</h2>
        <div class="row">
          <label class="field">时<input id="schH" type="number" min="0" max="23" /></label>
          <label class="field">分<input id="schM" type="number" min="0" max="59" /></label>
          <label class="field">秒<input id="schS" type="number" min="0" max="59" /></label>
        </div>
      </div>

      <div class="block">
        <h2>随机开始时间</h2>
        <div class="row">
          <label class="field">时<input id="stH" type="number" min="0" max="23" /></label>
          <label class="field">分<input id="stM" type="number" min="0" max="59" /></label>
          <label class="field">秒<input id="stS" type="number" min="0" max="59" /></label>
        </div>
        <h2 style="margin-top:14px">随机结束时间</h2>
        <div class="row">
          <label class="field">时<input id="enH" type="number" min="0" max="23" /></label>
          <label class="field">分<input id="enM" type="number" min="0" max="59" /></label>
          <label class="field">秒<input id="enS" type="number" min="0" max="59" /></label>
        </div>
      </div>

      <div class="block">
        <h2>连接</h2>
        <div class="row">
          <label class="field full">Gist ID<input id="gistId" autocomplete="off" /></label>
          <label class="field full">文件名<input id="fileName" value="dingtalk-config.json" autocomplete="off" /></label>
          <label class="field full">Token<input id="token" type="password" autocomplete="off" /></label>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="saveCfgBtn" type="button">保存</button>
        <button class="btn ghost" id="reloadCfgBtn" type="button">重新读取</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORE_KEY = "dingtalk_remote_setup_v1";
    const DEFAULT = {
      enabled: true,
      mode: "auto",
      scheduleHour: 8,
      scheduleMinute: 27,
      scheduleSecond: 0,
      startHour: 8,
      startMinute: 28,
      startSecond: 0,
      endHour: 8,
      endMinute: 30,
      endSecond: 50,
      manualTriggerId: "",
      lastResult: null
    };

    let setup = loadSetup();
    let config = Object.assign({}, DEFAULT);
    let busy = false;

    function loadSetup() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; }
      catch (e) { return {}; }
    }
    function saveSetup(s) {
      setup = s;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    }
    function clamp(n, min, max) {
      n = parseInt(n, 10);
      if (isNaN(n)) return min;
      return Math.max(min, Math.min(max, n));
    }
    function normalize(raw) {
      const c = Object.assign({}, DEFAULT, raw || {});
      c.enabled = !!c.enabled;
      c.mode = c.mode === "manual" ? "manual" : "auto";
      ["scheduleHour","startHour","endHour"].forEach((k) => c[k] = clamp(c[k], 0, 23));
      ["scheduleMinute","scheduleSecond","startMinute","startSecond","endMinute","endSecond"].forEach((k) => c[k] = clamp(c[k], 0, 59));
      c.manualTriggerId = c.manualTriggerId ? String(c.manualTriggerId) : "";
      return c;
    }
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function headers() {
      return {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + setup.token,
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
      };
    }
    function showPage(name) {
      document.getElementById("homePage").classList.toggle("active", name === "home");
      document.getElementById("configPage").classList.toggle("active", name === "config");
    }
    function applyHome() {
      const orb = document.getElementById("orbBtn");
      const manual = config.mode === "manual";
      document.getElementById("modeTag").textContent = manual ? "手动" : "自动";
      if (manual) {
        orb.className = "orb on" + (busy ? " busy" : "");
        orb.textContent = "启动";
      } else {
        orb.className = "orb " + (config.enabled ? "on" : "off") + (busy ? " busy" : "");
        orb.textContent = config.enabled ? "开" : "关";
      }
      const title = document.getElementById("statusTitle");
      const reason = document.getElementById("statusReason");
      const lr = config.lastResult;
      if (!lr) {
        title.className = "title wait";
        title.textContent = "等待";
        reason.textContent = "";
        return;
      }
      title.className = "title " + (lr.ok ? "ok" : "bad");
      title.textContent = lr.ok ? "成功" : "失败";
      reason.textContent = lr.reason || "";
    }
    function fillConfigForm() {
      document.getElementById("modeAutoBtn").classList.toggle("active", config.mode === "auto");
      document.getElementById("modeManualBtn").classList.toggle("active", config.mode === "manual");
      document.getElementById("enableOnBtn").classList.toggle("active", !!config.enabled);
      document.getElementById("enableOffBtn").classList.toggle("active", !config.enabled);
      document.getElementById("schH").value = config.scheduleHour;
      document.getElementById("schM").value = config.scheduleMinute;
      document.getElementById("schS").value = config.scheduleSecond;
      document.getElementById("stH").value = config.startHour;
      document.getElementById("stM").value = config.startMinute;
      document.getElementById("stS").value = config.startSecond;
      document.getElementById("enH").value = config.endHour;
      document.getElementById("enM").value = config.endMinute;
      document.getElementById("enS").value = config.endSecond;
      document.getElementById("gistId").value = setup.gistId || "";
      document.getElementById("fileName").value = setup.fileName || "dingtalk-config.json";
      document.getElementById("token").value = setup.token || "";
    }
    function readConfigForm() {
      const next = normalize({
        enabled: document.getElementById("enableOnBtn").classList.contains("active"),
        mode: document.getElementById("modeManualBtn").classList.contains("active") ? "manual" : "auto",
        scheduleHour: document.getElementById("schH").value,
        scheduleMinute: document.getElementById("schM").value,
        scheduleSecond: document.getElementById("schS").value,
        startHour: document.getElementById("stH").value,
        startMinute: document.getElementById("stM").value,
        startSecond: document.getElementById("stS").value,
        endHour: document.getElementById("enH").value,
        endMinute: document.getElementById("enM").value,
        endSecond: document.getElementById("enS").value,
        manualTriggerId: config.manualTriggerId,
        lastResult: config.lastResult
      });
      const startSec = next.startHour * 3600 + next.startMinute * 60 + next.startSecond;
      const endSec = next.endHour * 3600 + next.endMinute * 60 + next.endSecond;
      if (endSec <= startSec) throw new Error("随机结束时间必须晚于开始时间");
      return next;
    }
    async function fetchGist() {
      if (!setup.gistId || !setup.token) throw new Error("请先在配置页填写连接信息");
      const res = await fetch("https://api.github.com/gists/" + encodeURIComponent(setup.gistId), { headers: headers() });
      if (!res.ok) throw new Error("读取失败 " + res.status);
      const data = await res.json();
      const file = data.files && data.files[setup.fileName || "dingtalk-config.json"];
      if (!file) throw new Error("找不到配置文件");
      config = normalize(JSON.parse(file.content || "{}"));
      applyHome();
      fillConfigForm();
      return config;
    }
    async function pushGist(next) {
      if (!setup.gistId || !setup.token) throw new Error("请先在配置页填写连接信息");
      next = normalize(next);
      const body = {
        files: {
          [setup.fileName || "dingtalk-config.json"]: {
            content: JSON.stringify(next, null, 2)
          }
        }
      };
      const res = await fetch("https://api.github.com/gists/" + encodeURIComponent(setup.gistId), {
        method: "PATCH",
        headers: headers(),
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error("保存失败 " + res.status);
      config = next;
      applyHome();
    }

    document.getElementById("goConfigBtn").onclick = function () {
      fillConfigForm();
      showPage("config");
    };
    document.getElementById("backHomeBtn").onclick = function () { showPage("home"); };

    document.getElementById("modeAutoBtn").onclick = function () {
      document.getElementById("modeAutoBtn").classList.add("active");
      document.getElementById("modeManualBtn").classList.remove("active");
    };
    document.getElementById("modeManualBtn").onclick = function () {
      document.getElementById("modeManualBtn").classList.add("active");
      document.getElementById("modeAutoBtn").classList.remove("active");
    };
    document.getElementById("enableOnBtn").onclick = function () {
      document.getElementById("enableOnBtn").classList.add("active");
      document.getElementById("enableOffBtn").classList.remove("active");
    };
    document.getElementById("enableOffBtn").onclick = function () {
      document.getElementById("enableOffBtn").classList.add("active");
      document.getElementById("enableOnBtn").classList.remove("active");
    };

    document.getElementById("saveCfgBtn").onclick = async function () {
      try {
        saveSetup({
          gistId: document.getElementById("gistId").value.trim(),
          fileName: document.getElementById("fileName").value.trim() || "dingtalk-config.json",
          token: document.getElementById("token").value.trim()
        });
        const next = readConfigForm();
        await pushGist(next);
        toast("已保存");
        showPage("home");
      } catch (e) {
        toast(String(e.message || e));
      }
    };
    document.getElementById("reloadCfgBtn").onclick = async function () {
      try {
        saveSetup({
          gistId: document.getElementById("gistId").value.trim(),
          fileName: document.getElementById("fileName").value.trim() || "dingtalk-config.json",
          token: document.getElementById("token").value.trim()
        });
        await fetchGist();
        toast("已读取");
      } catch (e) {
        toast(String(e.message || e));
      }
    };

    document.getElementById("orbBtn").onclick = async function () {
      if (busy) return;
      if (!setup.gistId || !setup.token) {
        showPage("config");
        toast("先完成配置");
        return;
      }
      busy = true;
      applyHome();
      try {
        await fetchGist();
        if (config.mode === "manual") {
          if (!config.enabled) {
            toast("每日开关为关");
          } else {
            const next = normalize(Object.assign({}, config, {
              manualTriggerId: uid(),
              lastResult: {
                ok: false,
                reason: "已发送，等待手机执行…",
                at: new Date().toISOString(),
                source: "manual"
              }
            }));
            await pushGist(next);
            toast("已发送");
          }
        } else {
          await pushGist(Object.assign({}, config, { enabled: !config.enabled }));
        }
      } catch (e) {
        toast(String(e.message || e));
      } finally {
        busy = false;
        applyHome();
      }
    };

    async function boot() {
      fillConfigForm();
      applyHome();
      if (setup.gistId && setup.token) {
        try {
          await fetchGist();
        } catch (e) {
          toast(String(e.message || e));
        }
      } else {
        showPage("config");
      }
      setInterval(async function () {
        if (!setup.gistId || !setup.token || busy) return;
        if (!document.getElementById("homePage").classList.contains("active")) return;
        try { await fetchGist(); } catch (e) {}
      }, 5000);
    }
    boot();
  </script>
</body>
</html>
